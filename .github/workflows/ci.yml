name: Verify and test the code

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and vet the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
          check-latest: true
      - run: go test ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
