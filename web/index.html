    el.innerHTML = `${ICONS.warn}<span>Can't reach the server — retrying every few seconds. The data below is the last good snapshot.</span>`;
  } else if (stale) {
    el.dataset.empty = 'false';
    el.hidden = false;
    el.innerHTML = `${ICONS.warn}<span>The save couldn't be re-read just now — showing the last good snapshot. <span style="color:var(--muted)">${esc(msg)}</span></span>`;
  } else {
    el.dataset.empty = 'true';
    el.hidden = true;
    el.innerHTML = '';
  }
}

function renderFooter() {
  const d = ui.data;
  const n = ui.inv && ui.inv.items ? ` · ${ui.inv.items.length} items` : '';
  $('#footer').textContent = d && d.save_path
    ? `save: ${d.save_path} · snapshot v${d.version} · ${d.recipes.length} recipes${n}`
    : '';
}

/* ---------- full render ---------- */
function emptySaveHTML(error) {
  return `<div class="empty">
    <h2>No save found</h2>
    <p>The server is running, but it couldn't find a Stardew Valley save to read.</p>
    <code>${esc(error)}</code>
    <p>Point it at a save file, e.g. <code>--save-path &lt;path-to-save-file&gt;</code>, then wait a moment — this page checks for changes on its own.</p>
  </div>`;
}

function renderAll() {
  const d = ui.data;
  renderBanner();
  renderFooter();
  if (!d) return;
  if (d.error && d.recipes.length === 0) {
    $('#items-total').textContent = '';
    $('#items-list').innerHTML = emptySaveHTML(d.error);
    $('#overview').innerHTML = emptySaveHTML(d.error);
    $('#crops').innerHTML = emptySaveHTML(d.error);
    return;
  }
  renderActiveList();
}

/* ---------- refresh ---------- */
let flashTimer;
function flashUpdated() {
  const el = $('#refresh-note');
  el.textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  el.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

async function refresh(initial = false) {
  const y = window.scrollY;
  const det = activeDetail();
  let state, inv, crops;
  try {
    [state, inv, crops] = await Promise.all([api.state(), api.inventory(), api.crops()]);
  } catch (e) {
    ui.netDown = true;
    renderBanner();
    return;
  }
  ui.netDown = false;
  ui.data = state;
  ui.inv = inv;
  ui.crops = crops;
  ui.version = state.version;
  renderAll();
  if (det) {
    if (ui.view === 'items') {
      loadItem(det, { quiet: true });
    } else if (recipeByKey(det)) {
      renderRecipeDetail();
    } else {
      ui.views.recipes.detailKey = null;
      applyNav();
    }
  } else {
    requestAnimationFrame(() => window.scrollTo(0, y));
  }
  if (!initial) flashUpdated();
}

async function poll() {
  if (!ui.data) { await refresh(); return; }
  let v;
  try {
    v = await api.version();
  } catch (e) {
    ui.netDown = true;
    renderBanner();
    return;
  }
  if (v.version !== ui.version) await refresh();
  else if (ui.netDown) { ui.netDown = false; renderBanner(); }
}

/* ---------- events ---------- */
$('#search').addEventListener('input', e => {
  ui.search = e.target.value;
  $('#search-clear').hidden = !ui.search;
  if (ui.data) renderActiveList();
});
$('#search-clear').addEventListener('click', () => {
  ui.search = '';
  $('#search').value = '';
  $('#search-clear').hidden = true;
  renderActiveList();
  $('#search').focus();
});
$('#show-all').addEventListener('change', e => {
  ui.showAll = e.target.checked;
  if (ui.data) renderOverview();
});
$('#type-seg').addEventListener('change', e => {
  ui.typeFilter = e.target.value;
  if (ui.data) renderOverview();
});
$('#view-seg').addEventListener('change', e => switchView(e.target.value));

$('#crop-filters').addEventListener('click', e => {
  const chip = e.target.closest('[data-loc]');
  if (chip) {
    ui.cropLocation = chip.dataset.loc;
    renderCrops();
    return;
  }
  if (e.target.closest('#crop-sort')) {
    ui.cropSort = ui.cropSort === 'soonest' ? 'count' : 'soonest';
    renderCrops();
    return;
  }
  if (e.target.closest('#crop-locked')) {
    ui.showLocked = !ui.showLocked;
    // Hiding the locations again must not leave the list filtered to one of
    // them, which would show nothing at all.
    if (!ui.showLocked && ui.cropLocation && !locationIsAccessible(ui.cropLocation)) ui.cropLocation = '';
    renderCrops();
  }
});
$('#crops').addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.group')) ui.cropOpen[d.dataset.loc] = d.open;
}, true);

$('#feeds-filter').addEventListener('click', () => {
  ui.onlyUseful = !ui.onlyUseful;
  $('#feeds-filter').setAttribute('aria-pressed', String(ui.onlyUseful));
  if (ui.inv) renderItems();
});
$('#sort-toggle').addEventListener('click', () => {
  ui.itemsSort = ui.itemsSort === 'value' ? 'count' : 'value';
  $('#sort-toggle').textContent = ui.itemsSort === 'value' ? 'Value ↓' : 'Count ↓';
  if (ui.inv) renderItems();
});

/* shared action buttons (empty states) */
$('#main').addEventListener('click', e => {
  const action = e.target.closest('[data-action]');
  if (!action) return;
  const a = action.dataset.action;
  if (a === 'clear-search') { ui.search = ''; $('#search').value = ''; $('#search-clear').hidden = true; renderActiveList(); }
  if (a === 'show-all') { ui.showAll = true; $('#show-all').checked = true; renderOverview(); }
  if (a === 'clear-type') { ui.typeFilter = 'all'; $('#type-seg input[value="all"]').checked = true; renderOverview(); }
  if (a === 'clear-useful') { ui.onlyUseful = false; $('#feeds-filter').setAttribute('aria-pressed', 'false'); renderItems(); }
  if (a === 'clear-crop-location') { ui.cropLocation = ''; renderCrops(); }
  if (a === 'show-locked') { ui.showLocked = true; renderCrops(); }
  if (a === 'goto-recipes') switchView('recipes');
});

$('#items-list').addEventListener('click', e => {
  const row = e.target.closest('.row[data-id]');
  if (row) openItemDetail(row.dataset.id);
});

$('#overview').addEventListener('click', e => {
  const row = e.target.closest('.row[data-key]');
  if (row) openRecipeDetail(row.dataset.key);
});
$('#overview').addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.group')) ui.open[d.dataset.state] = d.open;
}, true);

$('#detail').addEventListener('click', e => {
  const el = e.target.closest('[data-action], .row[data-key]');
  if (!el) return;
  if (el.dataset.action === 'back') closeDetail();
  if (el.dataset.action === 'plan') loadPlan(el.dataset.key);
  if (el.dataset.action === 'retry-item') loadItem(ui.views.items.detailId);
  if (el.dataset.key && el.classList.contains('row')) openRecipeDetail(el.dataset.key);
});

/* ---------- boot ---------- */
$('#brand').innerHTML = `${ICONS.leaf}Stardew <span>Craftbook</span>`;
$('#items-list').innerHTML = '<p class="loading">Reading the save…</p>';
history.replaceState({ v: 'items', d: null }, '');
refresh(true);
setInterval(poll, 5000);
</script>
</body>
</html>
