<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stardew Craftbook</title>
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --bg: #ecefe6;
  --surface: #f7f8f2;
  --raised: #ffffff;
  --ink: #232d27;
  --muted: #5f6b62;
  --faint: #8a948c;
  --line: #d7dccd;
  --accent: #2f6f47;
  --accent-ink: #255737;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --craft: #96682a;
  --cook: #8c4a68;
  --warn: #8a6219;
  --warn-soft: color-mix(in srgb, var(--warn) 13%, transparent);
  --radius: 12px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111612;
    --surface: #18201a;
    --raised: #1f2821;
    --ink: #e3e9df;
    --muted: #9aa895;
    --faint: #76826f;
    --line: #2c372e;
    --accent: #93c7a0;
    --accent-ink: #aed8b9;
    --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
    --craft: #d6a55e;
    --cook: #d78fab;
    --warn: #d8b26a;
    --warn-soft: color-mix(in srgb, var(--warn) 15%, transparent);
  }
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { overflow-x: clip; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}
svg.ic { width: 16px; height: 16px; flex: none; }

/* ---------- header ---------- */
.site {
  max-width: 640px;
  margin: 0 auto;
  padding: 18px 14px 10px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.site h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.site h1 svg { width: 20px; height: 20px; color: var(--accent); }
.site h1 span { color: var(--muted); font-weight: 600; }

/* ---------- sticky controls ---------- */
.controls {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 8px 0 10px;
}
.controls-inner {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 14px;
  display: grid;
  gap: 8px;
}
.search { position: relative; }
.search > svg {
  position: absolute;
  left: 12px; top: 50%;
  translate: 0 -50%;
  color: var(--faint);
  pointer-events: none;
}
.search input {
  width: 100%;
  min-height: 44px;
  padding: 10px 44px 10px 38px;
  font-size: 16px; /* avoid iOS focus zoom */
  font-family: var(--font);
  color: var(--ink);
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 999px;
  -webkit-appearance: none;
  appearance: none;
}
.search input::placeholder { color: var(--faint); }
.search input:focus-visible { outline-offset: 0; }
.search-clear {
  position: absolute;
  right: 4px; top: 50%;
  translate: 0 -50%;
  width: 36px; height: 36px;
  display: grid;
  place-items: center;
  background: none;
  border: 0;
  border-radius: 50%;
  color: var(--muted);
  cursor: pointer;
}
/* ---------- sticky controls ---------- */
.seg {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
}
.seg-opt { flex: 1; position: relative; }
.seg-opt input {
  position: absolute;
  opacity: 0;
  width: 1px; height: 1px;
}
.seg-opt span {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 38px;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.seg-opt svg { width: 14px; height: 14px; }
.seg-opt input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.seg-opt input:checked + span {
  background: var(--raised);
  color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--line);
}
.seg-opt[data-t="crafting"] input:checked + span {
  color: var(--craft);
  background: color-mix(in srgb, var(--craft) 14%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--craft) 35%, transparent);
}
.seg-opt[data-t="cooking"] input:checked + span {
  color: var(--cook);
  background: color-mix(in srgb, var(--cook) 14%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cook) 35%, transparent);
}
.controls-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 32px;
}
.switch {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.switch input {
  position: absolute;
  opacity: 0;
  width: 1px; height: 1px;
}
.switch .track {
  width: 40px; height: 24px;
  border-radius: 999px;
  border: 1.5px solid var(--faint);
  position: relative;
  transition: background 0.15s, border-color 0.15s;
  flex: none;
}
.switch .track::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 17px; height: 17px;
  border-radius: 50%;
  background: var(--faint);
  transition: translate 0.15s, background 0.15s;
}
.switch input:checked + .track {
  background: var(--accent);
  border-color: var(--accent);
}
.switch input:checked + .track::after {
  translate: 16px 0;
  background: var(--bg);
}
.switch input:focus-visible + .track {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.switch-label { font-size: 14px; color: var(--muted); }
.refresh-note {
  font-size: 12px;
  color: var(--accent-ink);
  opacity: 0;
  transition: opacity 0.4s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.refresh-note::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
}
.refresh-note.show { opacity: 1; }

/* ---------- banner ---------- */
.wrap { max-width: 640px; margin: 0 auto; padding: 0 14px; }
.banner {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: var(--radius);
  background: var(--warn-soft);
  color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 13.5px;
}
.banner svg { color: var(--warn); margin-top: 1px; }

/* ---------- sections ---------- */
main { max-width: 640px; margin: 0 auto; padding: 12px 14px 24px; }
.group { margin-top: 14px; }
.group > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  border-radius: 8px;
}
.group > summary::-webkit-details-marker { display: none; }
.group-label {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}
.group-count {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-variant-numeric: tabular-nums;
}
.group > summary .chev {
  margin-left: auto;
  color: var(--faint);
  transition: rotate 0.15s;
}
.group[open] > summary .chev { rotate: 90deg; }
.group-empty {
  margin: 2px 0 8px;
  padding: 8px 2px;
  color: var(--faint);
  font-size: 13.5px;
}

/* ---------- rows ---------- */
.rows {
  list-style: none;
  margin: 2px 0 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 16px;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 56px;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.row:active { background: var(--raised); }
.row-text { display: grid; gap: 3px; min-width: 0; }
.row-name {
  font-weight: 620;
  font-size: 15px;
  overflow-wrap: anywhere;
}
.row-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 8px;
  font-size: 12.5px;
  color: var(--muted);
  min-width: 0;
}
.row .chev { color: var(--faint); justify-self: end; }
.needs {
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}
.needs b { color: var(--ink); font-weight: 600; }

/* ---------- badges & chips ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 2px 8px 2px 6px;
  border-radius: 999px;
  flex: none;
}
.badge svg { width: 12px; height: 12px; }
.badge.crafting { color: var(--craft); background: color-mix(in srgb, var(--craft) 13%, transparent); }
.badge.cooking  { color: var(--cook);  background: color-mix(in srgb, var(--cook) 13%, transparent); }
.yields {
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--accent-ink);
  font-weight: 600;
}

/* ---------- readiness pips (signature) ---------- */
.pips {
  display: inline-flex;
  gap: 3px;
  align-items: center;
}
.pips i {
  width: 13px; height: 8px;
  border-radius: 3px;
  border: 1.5px solid var(--faint);
}
.pips i.on {
  background: var(--accent);
  border-color: var(--accent);
}

/* ---------- detail view ---------- */
.back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 44px;
  padding: 8px 12px 8px 4px;
  background: none;
  border: 0;
  color: var(--accent-ink);
  font-weight: 620;
  cursor: pointer;
  border-radius: 8px;
}
.detail-head { margin-top: 2px; }
.detail-head h2 {
  margin: 0 0 8px;
  font-size: 23px;
  font-weight: 750;
  letter-spacing: 0.005em;
  overflow-wrap: anywhere;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 650;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  background: var(--surface);
}
.chip svg { width: 12px; height: 12px; }
.chip.state-craftable { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
.chip.state-partial   { color: var(--warn);       border-color: color-mix(in srgb, var(--warn) 40%, transparent);   background: var(--warn-soft); }
.chip.state-far_off   { color: var(--muted); }
.unlock {
  margin: 12px 0 0;
  font-size: 13.5px;
  color: var(--muted);
}
.unlock .wiki { white-space: nowrap; font-weight: 600; }
.not-learned {
  margin: 8px 0 0;
  font-size: 13.5px;
  color: var(--warn);
  display: flex;
  gap: 6px;
  align-items: center;
}
.not-learned svg { width: 14px; height: 14px; }

.detail h3 {
  margin: 22px 0 6px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ingredient lines */
.ings { list-style: none; margin: 0; padding: 0; }
.ing {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  gap: 3px 10px;
  align-items: center;
  padding: 10px 2px;
  border-top: 1px solid var(--line);
}
.ing:first-child { border-top: 0; }
.ing-ic { display: grid; place-items: center; }
.ing.ok .ing-ic { color: var(--accent); }
.ing.miss .ing-ic { color: var(--faint); }
.ing-body { display: grid; min-width: 0; }
.ing-name { overflow-wrap: anywhere; }
.ing.miss .ing-name { font-weight: 650; }
.ing.ok .ing-name { color: var(--muted); }
.ing-cat { font-size: 12px; color: var(--faint); }
.ing-frac {
  font-family: var(--mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ing-frac b { font-weight: 700; }
.ing.ok .ing-frac { color: var(--muted); }
.bar {
  grid-column: 2 / -1;
  height: 6px;
  border-radius: 3px;
  background: var(--line);
  overflow: hidden;
}
.bar > span {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: var(--accent);
}

/* plan */
.plan-btn, .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 0;
  background: var(--accent);
  color: #fff;
  font-weight: 650;
  cursor: pointer;
}
@media (prefers-color-scheme: dark) {
  .plan-btn, .btn { color: #10211a; }
}
.btn.ghost {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
}
.plan-body { margin-top: 12px; }
.plan-note { font-size: 12.5px; color: var(--faint); margin: 10px 0 0; }
.plan-plain { margin: 4px 0 0; color: var(--muted); }
.steps {
  list-style: none;
  margin: 6px 0 0;
  padding: 0 0 0 20px;
  position: relative;
}
.steps::before {
  content: "";
  position: absolute;
  left: 5px; top: 12px; bottom: 12px;
  width: 2px;
  background: var(--line);
  border-radius: 1px;
}
.step { position: relative; padding: 10px 0; }
.step::before {
  content: "";
  position: absolute;
  left: -19px; top: 17px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
}
.step-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.step-machine { font-weight: 700; }
.step-runs {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-ink);
  background: var(--accent-soft);
  padding: 1px 8px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.step-time { font-size: 12.5px; color: var(--faint); }
.step-io, .step-total {
  font-size: 13.5px;
  margin-top: 3px;
  display: flex;
  gap: 8px;
}
.step-io .tag, .step-total .tag {
  flex: none;
  width: 62px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--faint);
  padding-top: 2px;
}
.step-io .vals { font-weight: 550; }
.step-total .vals { color: var(--muted); font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.still { margin-top: 16px; }
.still h4 {
  margin: 0 0 4px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}
.still ul { list-style: none; margin: 0; padding: 0; }
.still li {
  padding: 8px 2px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}
.still li a { font-weight: 620; }
.still .frac {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ---------- empty / misc states ---------- */
.empty {
  margin-top: 28px;
  padding: 22px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.empty h2 { margin: 0 0 8px; font-size: 18px; }
.empty p { margin: 8px 0; color: var(--muted); }
.empty code {
  display: block;
  margin: 10px 0;
  padding: 10px 12px;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 12.5px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.empty .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.loading { padding: 40px 0; text-align: center; color: var(--faint); }

/* ---------- footer ---------- */
footer {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 14px calc(18px + env(safe-area-inset-bottom));
  font-size: 12px;
  color: var(--faint);
  overflow-wrap: anywhere;
}

/* ---------- motion ---------- */
@media (prefers-reduced-motion: no-preference) {
  ::view-transition-old(root),
  ::view-transition-new(root) { animation-duration: 0.18s; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<header class="site">
  <h1 id="brand"></h1>
</header>

<div class="controls" id="controls">
  <div class="controls-inner">
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search all recipes…" autocomplete="off" enterkeyhint="search" aria-label="Search recipes">
      <button class="search-clear" id="search-clear" hidden aria-label="Clear search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="seg" role="radiogroup" aria-label="Recipe type">
      <label class="seg-opt" data-t="all">
        <input type="radio" name="type" value="all" checked>
        <span>All types</span>
      </label>
      <label class="seg-opt" data-t="crafting">
        <input type="radio" name="type" value="crafting">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 5.5 4.5 13.5l2.5 2.5 8-8"/><path d="M11 4h6a2 2 0 0 1 2 2v3l-4 2-5-5z"/></svg>Crafting</span>
      </label>
      <label class="seg-opt" data-t="cooking">
        <input type="radio" name="type" value="cooking">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v2.5a8 8 0 0 1-16 0z"/><path d="M2 11h20"/><path d="M9 8c0-1.4 1-1.6 1-3M14 8c0-1.4 1-1.6 1-3"/></svg>Cooking</span>
      </label>
    </div>
    <div class="controls-row">
      <label class="switch">
        <input type="checkbox" id="show-all">
        <span class="track" aria-hidden="true"></span>
        <span class="switch-label">Show all recipes</span>
      </label>
      <span class="refresh-note" id="refresh-note" role="status" aria-live="polite"></span>
    </div>
  </div>
</div>

<div class="wrap"><div class="banner" id="banner" hidden></div></div>

<main id="main">
  <div id="overview"></div>
  <div id="detail" class="detail" hidden></div>
</main>

<footer id="footer"></footer>

<script>
'use strict';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const ICONS = {
  leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 9 13 4 20 4c0 9-4 15-13 15"/><path d="M5 19c3-5 7-8 11-10"/></svg>',
  hammer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 5.5 4.5 13.5l2.5 2.5 8-8"/><path d="M11 4h6a2 2 0 0 1 2 2v3l-4 2-5-5z"/></svg>',
  pot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v2.5a8 8 0 0 1-16 0z"/><path d="M2 11h20"/><path d="M9 8c0-1.4 1-1.6 1-3M14 8c0-1.4 1-1.6 1-3"/></svg>',
  check: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>',
  circle: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>',
  half: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>',
  chevR: '<svg class="ic chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>',
  chevL: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>',
  ext: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/></svg>',
  warn: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19z"/><path d="M12 9.5V14"/><path d="M12 17h.01"/></svg>'
};

/* ---------- state ---------- */
const ui = {
  data: null,          // last /api/state payload
  version: null,
  search: '',
  showAll: false,
  typeFilter: 'all',
  open: { craftable: true, partial: true, far_off: false },
  detailKey: null,
  detailPushed: false,
  overviewScroll: 0,
  plan: null,          // { key, status: 'loading'|'ready'|'error', result }
  netDown: false
};

/* ---------- api ---------- */
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) {
    const err = new Error('HTTP ' + r.status);
    err.status = r.status;
    try { err.body = await r.json(); } catch (_) {}
    throw err;
  }
  return r.json();
}
const api = {
  state: () => fetchJSON('/api/state'),
  version: () => fetchJSON('/api/version'),
  plan: key => fetchJSON('/api/plan/' + encodeURIComponent(key))
};

/* ---------- shared bits ---------- */
const GROUPS = [
  ['craftable', 'Craftable now'],
  ['partial', 'Partially there'],
  ['far_off', 'Far off']
];
const STATE_LABEL = { craftable: 'Ready to craft', partial: 'Partially there', far_off: 'Far off' };
const STATE_ICON = { craftable: ICONS.check, partial: ICONS.half, far_off: ICONS.circle };

function badge(type) {
  const icon = type === 'cooking' ? ICONS.pot : ICONS.hammer;
  const label = type === 'cooking' ? 'Cooking' : 'Crafting';
  return `<span class="badge ${esc(type)}">${icon}${label}</span>`;
}

function pips(entry) {
  const total = entry.recipe.ingredients.length;
  const ready = total - (entry.missing || []).length;
  let out = '';
  for (let i = 0; i < total; i++) out += `<i class="${i < ready ? 'on' : ''}"></i>`;
  return `<span class="pips" role="img" aria-label="${ready} of ${total} ingredients satisfied">${out}</span>`;
}

function needsSummary(missing) {
  const shown = missing.slice(0, 2)
    .map(m => `<b>${m.need}×</b> ${esc(m.name)}`).join(', ');
  const rest = missing.length - 2;
  return `needs ${shown}${rest > 0 ? ` <span>+${rest} more</span>` : ''}`;
}

function recipeByKey(key) {
  return ui.data && ui.data.recipes.find(r => r.recipe.key === key);
}

/* ---------- overview ---------- */
function rowHTML(entry) {
  const r = entry.recipe;
  let meta = badge(r.type);
  if (entry.state === 'craftable') {
    if (r.output_qty > 1) meta += `<span class="yields">yields ×${r.output_qty}</span>`;
  } else {
    meta += `<span class="needs">${needsSummary(entry.missing || [])}</span>`;
  }
  const side = entry.state === 'craftable' ? '' : pips(entry);
  return `<li><button class="row" data-key="${esc(r.key)}">
    <span class="row-text">
      <span class="row-name">${esc(r.name)}</span>
      <span class="row-meta">${meta}</span>
    </span>
    ${side}${ICONS.chevR}
  </button></li>`;
}

function renderOverview() {
  const el = $('#overview');
  const q = ui.search.trim().toLowerCase();
  const filtering = q !== '' || ui.typeFilter !== 'all';
  let list = ui.data.recipes;
  if (q) list = list.filter(r => r.recipe.name.toLowerCase().includes(q));
  else if (!ui.showAll) list = list.filter(r => r.learned);
  if (ui.typeFilter !== 'all') list = list.filter(r => r.recipe.type === ui.typeFilter);

  const grouped = { craftable: [], partial: [], far_off: [] };
  for (const r of list) (grouped[r.state] || grouped.far_off).push(r);

  if (filtering && list.length === 0) {
    const typeWord = ui.typeFilter === 'all' ? '' : ui.typeFilter + ' ';
    const actions = [
      q ? '<button class="btn ghost" data-action="clear-search">Clear search</button>' : '',
      ui.typeFilter !== 'all' ? '<button class="btn ghost" data-action="clear-type">All types</button>' : '',
      !ui.showAll ? '<button class="btn ghost" data-action="show-all">Show all recipes</button>' : ''
    ].join('');
    el.innerHTML = `<div class="empty">
      <h2>${q ? `No ${typeWord}recipes match “${esc(ui.search.trim())}”` : `No ${ui.showAll ? '' : 'learned '}${typeWord}recipes`}</h2>
      <p>${q
        ? 'Search covers every known recipe, learned or not — so this name isn\'t in the book.'
        : 'Nothing in the current view matches these filters.'}</p>
      <div class="actions">${actions}</div>
    </div>`;
    return;
  }

  el.innerHTML = GROUPS.map(([state, label]) => {
    const rows = grouped[state];
    if (filtering && rows.length === 0) return '';
    const body = rows.length
      ? `<ul class="rows">${rows.map(rowHTML).join('')}</ul>`
      : `<p class="group-empty">None right now.</p>`;
    return `<details class="group" data-state="${state}"${ui.open[state] ? ' open' : ''}>
      <summary>
        <span class="group-label">${label}</span>
        <span class="group-count">${rows.length}</span>
        ${ICONS.chevR}
      </summary>
      ${body}
    </details>`;
  }).join('');
}

/* ---------- detail ---------- */
function ingLine(ing, miss) {
  const cat = ing.category ? '<span class="ing-cat">any item of this type works</span>' : '';
  if (miss) {
    const pct = miss.need > 0 ? Math.min(100, Math.round(miss.have / miss.need * 100)) : 0;
    return `<li class="ing miss">
      <span class="ing-ic">${ICONS.circle}</span>
      <span class="ing-body"><span class="ing-name">${esc(miss.name)}</span>${cat}</span>
      <span class="ing-frac"><b>${miss.have}</b>/${miss.need}</span>
      <span class="bar" role="img" aria-label="${miss.have} of ${miss.need} ${esc(miss.name)}"><span style="width:${pct}%"></span></span>
    </li>`;
  }
  return `<li class="ing ok">
    <span class="ing-ic">${ICONS.check}</span>
    <span class="ing-body"><span class="ing-name">${esc(ing.name)}</span>${cat}</span>
    <span class="ing-frac">×${ing.qty} · ready</span>
  </li>`;
}

function renderDetail() {
  const entry = recipeByKey(ui.detailKey);
  if (!entry) return;
  const r = entry.recipe;
  const missingById = new Map((entry.missing || []).map(m => [m.id, m]));

  const chips = [
    badge(r.type),
    r.output_qty > 1 ? `<span class="chip">yields ×${r.output_qty}</span>` : '',
    `<span class="chip state-${entry.state}">${STATE_ICON[entry.state] || ''}${STATE_LABEL[entry.state] || entry.state}</span>`
  ].join('');

  const ings = r.ingredients.map(ing => ingLine(ing, missingById.get(ing.id))).join('');

  const planSection = entry.state === 'craftable' ? '' : `
    <h3>Getting there</h3>
    <div class="plan-area">
      <button class="plan-btn" data-action="plan" data-key="${esc(r.key)}">How to get there</button>
      <div class="plan-body"></div>
    </div>`;

  $('#detail').innerHTML = `
    <button class="back" data-action="back">${ICONS.chevL}All recipes</button>
    <div class="detail-head">
      <h2 tabindex="-1">${esc(r.name)}</h2>
      <div class="chips">${chips}</div>
      <p class="unlock">Unlock: ${esc(r.unlock)} ·
        <a class="wiki" href="${esc(r.wiki_url)}" target="_blank" rel="noopener">wiki ${ICONS.ext}</a>
      </p>
      ${entry.learned ? '' : `<p class="not-learned">${ICONS.warn}You haven't learned this recipe yet.</p>`}
    </div>
    <h3>Ingredients</h3>
    <ul class="ings">${ings}</ul>
    ${planSection}`;

  if (ui.plan && ui.plan.key === ui.detailKey) loadPlan(ui.detailKey);
}

function fmtMinutes(m) {
  if (m >= 60 && m % 60 === 0) return `≈${m / 60}h`;
  if (m > 120) return `≈${(m / 60).toFixed(1)}h`;
  return `~${m}m`;
}

function ioList(list) {
  return list.map(i => `${i.qty} ${esc(i.name)}`).join(' + ');
}

async function loadPlan(key) {
  const body = $('#detail .plan-body');
  if (!body) return;
  ui.plan = { key, status: 'loading' };
  const btn = $('#detail .plan-btn');
  if (btn) btn.hidden = true;
  body.innerHTML = '<p class="plan-plain">Working it out…</p>';
  try {
    const p = await api.plan(key);
    if (ui.detailKey !== key) return; // user moved on
    ui.plan = { key, status: 'ready', result: p };
    renderPlan(body, p);
  } catch (e) {
    if (ui.detailKey !== key) return;
    ui.plan = { key, status: 'error' };
    body.innerHTML = `<p class="plan-plain">Couldn't work out a plan${e && e.status === 503 ? ' — no save is loaded' : ''}.</p>
      <button class="btn ghost" data-action="plan" data-key="${esc(key)}">Try again</button>`;
  }
}

function renderPlan(body, p) {
  let html = '';
  if (!p.steps || p.steps.length === 0) {
    html += p.feasible
      ? '<p class="plan-plain">You already have everything — nothing needs making.</p>'
      : '<p class="plan-plain">Nothing here can be produced from what you own.</p>';
  } else {
    html += `<ol class="steps">${p.steps.map(s => {
      const totals = s.inputs.map(i => `${i.qty * s.runs} ${esc(i.name)}`).join(' + ');
      const outTotal = s.output.qty * s.runs;
      return `<li class="step">
        <div class="step-head">
          <span class="step-machine">${esc(s.machine)}</span>
          <span class="step-runs">×${s.runs} ${s.runs === 1 ? 'run' : 'runs'}</span>
          <span class="step-time">${fmtMinutes(s.minutes)} each</span>
        </div>
        <div class="step-io"><span class="tag">per run</span><span class="vals">${ioList(s.inputs)} → ${s.output.qty} ${esc(s.output.name)}</span></div>
        ${s.runs > 1 ? `<div class="step-total"><span class="tag">total</span><span class="vals">${totals} → ${outTotal} ${esc(s.output.name)}</span></div>` : ''}
      </li>`;
    }).join('')}</ol>
    <p class="plan-note">Durations are in-game time, per run.</p>`;
  }
  if (!p.feasible && p.still_missing && p.still_missing.length) {
    html += `<div class="still">
      <h4>You still need to obtain</h4>
      <ul>${p.still_missing.map(m => `<li>
        <a href="${esc(m.wiki_url)}" target="_blank" rel="noopener">${esc(m.name)} ${ICONS.ext}</a>
        <span class="frac">${m.have}/${m.need}</span>
      </li>`).join('')}</ul>
    </div>`;
  } else if (p.feasible && p.steps && p.steps.length) {
    html += '<p class="plan-plain">That covers everything you were missing.</p>';
  }
  body.innerHTML = html;
}

/* ---------- view switching ---------- */
function swapViews(showDetail) {
  const apply = () => {
    $('#overview').hidden = showDetail;
    $('#controls').hidden = showDetail;
    $('#banner').hidden = showDetail || $('#banner').dataset.empty === 'true';
    $('#footer').hidden = showDetail;
    $('#detail').hidden = !showDetail;
  };
  if (!reducedMotion() && document.startViewTransition) document.startViewTransition(apply);
  else apply();
}

function openDetail(key, push = true) {
  ui.overviewScroll = window.scrollY;
  ui.detailKey = key;
  ui.plan = null;
  renderDetail();
  swapViews(true);
  window.scrollTo(0, 0);
  const h = $('#detail h2');
  if (h) h.focus({ preventScroll: true });
  if (push) { history.pushState({ detail: key }, ''); ui.detailPushed = true; }
}

function closeDetail(viaHistory = false) {
  const key = ui.detailKey;
  ui.detailKey = null;
  ui.plan = null;
  swapViews(false);
  window.scrollTo(0, ui.overviewScroll);
  const row = $('#overview .row[data-key="' + CSS.escape(key) + '"]');
  if (row) row.focus({ preventScroll: true });
  if (!viaHistory && ui.detailPushed) { ui.detailPushed = false; history.back(); }
}

window.addEventListener('popstate', e => {
  if (e.state && e.state.detail) {
    ui.detailPushed = true;
    ui.overviewScroll = ui.overviewScroll || 0;
    ui.detailKey = e.state.detail;
    ui.plan = null;
    renderDetail();
    swapViews(true);
    window.scrollTo(0, 0);
  } else if (ui.detailKey) {
    ui.detailPushed = false;
    closeDetail(true);
  }
});

/* ---------- banner / footer ---------- */
function renderBanner() {
  const el = $('#banner');
  const d = ui.data;
  if (ui.netDown) {
    el.dataset.empty = 'false';
    el.hidden = false;
    el.innerHTML = `${ICONS.warn}<span>Can't reach the server — retrying every few seconds. The data below is the last good snapshot.</span>`;
  } else if (d && d.error && d.recipes.length) {
    el.dataset.empty = 'false';
    el.hidden = false;
    el.innerHTML = `${ICONS.warn}<span>The save couldn't be re-read just now — showing the last good snapshot. <span style="color:var(--muted)">${esc(d.error)}</span></span>`;
  } else {
    el.dataset.empty = 'true';
    el.hidden = true;
    el.innerHTML = '';
  }
}

function renderFooter() {
  const d = ui.data;
  $('#footer').textContent = d && d.save_path
    ? `save: ${d.save_path} · snapshot v${d.version} · ${d.recipes.length} recipes`
    : '';
}

/* ---------- full render ---------- */
function renderAll() {
  const d = ui.data;
  renderBanner();
  renderFooter();
  if (!d) return;
  if (d.error && d.recipes.length === 0) {
    $('#overview').innerHTML = `<div class="empty">
      <h2>No save found</h2>
      <p>The server is running, but it couldn't find a Stardew Valley save to read.</p>
      <code>${esc(d.error)}</code>
      <p>Point it at a save file, e.g. <code>--save-path &lt;path-to-save-file&gt;</code>, then wait a moment — this page checks for changes on its own.</p>
    </div>`;
    return;
  }
  renderOverview();
}

/* ---------- refresh ---------- */
let flashTimer;
function flashUpdated() {
  const el = $('#refresh-note');
  el.textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  el.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

async function refresh(initial = false) {
  const y = window.scrollY;
  const detailOpen = ui.detailKey != null;
  let d;
  try {
    d = await api.state();
  } catch (e) {
    ui.netDown = true;
    renderBanner();
    return;
  }
  ui.netDown = false;
  ui.data = d;
  ui.version = d.version;
  renderAll();
  if (detailOpen) {
    if (recipeByKey(ui.detailKey)) renderDetail();
    else closeDetail(true);
  } else {
    requestAnimationFrame(() => window.scrollTo(0, y));
  }
  if (!initial) flashUpdated();
}

async function poll() {
  if (!ui.data) { await refresh(); return; }
  let v;
  try {
    v = await api.version();
  } catch (e) {
    ui.netDown = true;
    renderBanner();
    return;
  }
  if (v.version !== ui.version) await refresh();
  else if (ui.netDown) { ui.netDown = false; renderBanner(); }
}

/* ---------- events ---------- */
$('#search').addEventListener('input', e => {
  ui.search = e.target.value;
  $('#search-clear').hidden = !ui.search;
  if (ui.data) renderOverview();
});
$('#search-clear').addEventListener('click', () => {
  ui.search = '';
  $('#search').value = '';
  $('#search-clear').hidden = true;
  renderOverview();
  $('#search').focus();
});
$('#show-all').addEventListener('change', e => {
  ui.showAll = e.target.checked;
  if (ui.data) renderOverview();
});
$('.seg').addEventListener('change', e => {
  ui.typeFilter = e.target.value;
  if (ui.data) renderOverview();
});

$('#overview').addEventListener('click', e => {
  const action = e.target.closest('[data-action]');
  if (action) {
    if (action.dataset.action === 'clear-search') { ui.search = ''; $('#search').value = ''; $('#search-clear').hidden = true; renderOverview(); }
    if (action.dataset.action === 'show-all') { ui.showAll = true; $('#show-all').checked = true; renderOverview(); }
    if (action.dataset.action === 'clear-type') { ui.typeFilter = 'all'; $('.seg input[value="all"]').checked = true; renderOverview(); }
    return;
  }
  const row = e.target.closest('.row');
  if (row) openDetail(row.dataset.key);
});
$('#overview').addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.group')) ui.open[d.dataset.state] = d.open;
}, true);

$('#detail').addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.dataset.action === 'back') closeDetail(false);
  if (el.dataset.action === 'plan') loadPlan(el.dataset.key);
});

/* ---------- boot ---------- */
$('#brand').innerHTML = `${ICONS.leaf}Stardew <span>Craftbook</span>`;
$('#overview').innerHTML = '<p class="loading">Reading the save…</p>';
refresh(true);
setInterval(poll, 5000);
</script>
</body>
</html>
